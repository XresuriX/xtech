name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test:run

      - name: Typecheck (ratchet - 63 pre-existing baseline errors)
        run: |
          set +e
          pnpm run typecheck > typecheck.log 2>&1
          count=$(grep -c 'error TS' typecheck.log || true)
          echo "typecheck errors: $count (baseline 63)"
          if [ "$count" -gt 63 ]; then
            cat typecheck.log
            exit 1
          fi
          exit 0
